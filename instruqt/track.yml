slug: mem0-scylladb-agent-memory
type: track
title: Agent Memory with mem0 and ScyllaDB
teaser: Give an AI support bot a memory with mem0, stored in a 3-node ScyllaDB cluster.
description: |-
  Start with a support bot that forgets everything between tickets. Add mem0 step by step:
  add and search memories, scope them by customer, bot and ticket, update and delete them,
  tag them with metadata, control what gets remembered, then measure performance and stop
  a ScyllaDB node to see high availability. Every step shows the CQL mem0 runs on ScyllaDB.
